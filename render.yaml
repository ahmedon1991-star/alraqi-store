services:
  - type: web
    name: alraqi-store
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run db:push && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alraqi-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: alraqi-db
    plan: free
